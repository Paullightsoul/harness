[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "4.0.0.dev0"
description = "Harness V4 (clone-and-upgrade) — TaskTool-first control plane; honesty + multi-tenant design"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Нужен только ролям с runner=sdk. Массовый воркер на runner=cli работает без него.
sdk = ["cursor-sdk"]
# Durable-плейн: DBOS поверх Postgres (ADR-0003 Фаза 2). Без него движок работает
# на SQLite-сторе как раньше; durable-режим включается флагом и требует Postgres.
durable = ["dbos"]
# Telegram-нотификации и бот (httpx.AsyncClient). Без него — нотификации в консоль.
telegram = ["httpx"]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "fastapi",
    "httpx",
    "jinja2",
]

[project.scripts]
harness = "harness.interface.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

# DBOS — сторонняя библиотека без типов: её декораторы/базовый класс приходят как Any.
# Ослабляем только два strict-правила в durable-слое, остальное остаётся строгим.
[[tool.mypy.overrides]]
module = "harness.durable.*"
disallow_untyped_decorators = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "harness.dashboard.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
