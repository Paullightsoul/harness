name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Blocking: the suite is green and must stay that way.
      - name: Tests
        run: pytest -q --cov=harness --cov-report=term

      # Ratcheting: pre-existing lint/typing debt may shrink, never grow.
      # See scripts/quality_ratchet.py for why this is not a plain `ruff check`.
      - name: Lint / type ratchet
        run: python scripts/quality_ratchet.py
